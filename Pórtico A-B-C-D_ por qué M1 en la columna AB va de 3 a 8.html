<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pórtico A-B-C-D: por qué M1 en la columna AB va de 3 a 8</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a65; --line:#d9d6cc;
    --beam:#2b2b28; --load:#d23c2f; --m1:#8a4fc7; --hi:#e08a00; --ok:#2f9a57;
    --area:rgba(138,79,199,.20); --area2:rgba(224,138,0,.22);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161614; --card:#1f1f1c; --ink:#ecebe6; --muted:#a3a29b; --line:#3a3934;
      --beam:#e2e0d8; --load:#ff6b5e; --m1:#c08bff; --hi:#ffb547; --ok:#5fd18b;
      --area:rgba(192,139,255,.22); --area2:rgba(255,181,71,.22); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1020px;margin:0 auto;padding:20px 16px 40px}
  h1{font-size:1.3rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .steps button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
  .steps button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .steps button.star{border-color:var(--load)}
  .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  svg{width:100%;height:auto;display:block}
  .panel h2{font-size:1.1rem;margin:0 0 8px}
  .panel p{margin:0 0 10px}
  .eq{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-size:1.1rem;background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0 12px;text-align:center;line-height:2.1}
  .f{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.2}
  .f>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
  .m1{color:var(--m1);font-weight:600} .hi{color:var(--hi);font-weight:600} .ld{color:var(--load);font-weight:600}
  .nav{display:flex;gap:8px;margin-top:12px}
  .nav button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem;cursor:pointer}
  .nav button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .nav button:disabled{opacity:.35;cursor:default}
  .slider{margin-top:10px;display:none}
  .slider.show{display:block}
  .slider label{font-size:.85rem;color:var(--muted)}
  .slider input{width:100%}
  .readout{font-size:.95rem;margin-top:4px}
  .tip{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
  table{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0 10px}
  td,th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <h1>Estado X<sub>1</sub> = 1: por qué la columna AB va de 3 a 8</h1>
  <p class="sub">Pórtico de tu cuaderno. En los pasos 4 a 6 mueve el corte con el deslizador.</p>
  <div class="steps" id="chips"></div>
  <div class="grid">
    <div class="card">
      <svg id="svg" viewBox="0 0 640 500" aria-label="Diagrama animado"></svg>
      <div class="slider" id="sliderBox">
        <label for="xs">Mueve el corte</label>
        <input id="xs" type="range" min="0" max="12" step="0.05" value="0">
        <div class="readout" id="readout"></div>
      </div>
    </div>
    <div class="card panel">
      <div id="text"></div>
      <div class="nav">
        <button id="prev">← Anterior</button>
        <button id="replay">↻ Repetir</button>
        <button id="next" class="primary">Siguiente →</button>
      </div>
    </div>
  </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('svg');
const S=40;                                   // px por metro
const A=[250,450], B=[250,250], C=[410,250], D=[410,130];
const K=13;                                   // px por unidad de momento
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const F=(a,b)=>`<span class="f"><span>${a}</span><span>${b}</span></span>`;

// p = recorrido desde D (m): 0-3 en DC, 3-7 en CB, 7-12 en BA
function pt(p){
  if(p<=3) return [D[0], D[1]+S*p];
  if(p<=7) return [C[0]-S*(p-3), C[1]];
  return [B[0], B[1]+S*(p-7)];
}
function Mval(p){ if(p<=3) return p; if(p<=7) return 3; return 3+(p-7); }
function tramo(p){ return p<=3?'DC':(p<=7?'CB':'BA'); }

const steps=[
 {chip:"1. Contexto", html:`
  <h2>1. De dónde viene este estado</h2>
  <p>El pórtico tiene A y D <b>empotrados</b>: 3 + 3 = 6 reacciones, menos 3 ecuaciones, da <b>GH = 3</b>.</p>
  <p>Sistema base: se libera el empotramiento en <b>D</b>. Queda un pórtico empotrado solo en A, con D libre. Las 3 reacciones de D pasan a ser las redundantes:</p>
  <div class="eq">X<sub>1</sub> = H<sub>D</sub> (horizontal) &nbsp; X<sub>2</sub> = V<sub>D</sub> (vertical) &nbsp; X<sub>3</sub> = M<sub>D</sub></div>
  <p>Lo que señalaste es el diagrama del <b>estado X<sub>1</sub> = 1</b>: <b>solo</b> una fuerza horizontal de 1 en D, sin cargas reales.</p>`},
 {chip:"2. Estado X1 = 1", html:`
  <h2>2. Estado X<sub>1</sub> = 1</h2>
  <p>Se quitan todas las cargas reales (los 10 kN y los 5 kN/m). Lo único que queda es una fuerza de <b>1 hacia la derecha en D</b>.</p>
  <p>Para sacar M<sub>1</sub>: cortas en cualquier punto y te quedas con el pedazo que va <b>del corte hasta D</b>. Ese pedazo no tiene el empotramiento, así que la única fuerza en él es el 1.</p>
  <p class="tip">Igual que en los voladizos: el extremo libre (D) es tu punto de partida.</p>`},
 {chip:"3. La regla del brazo", html:`
  <h2>3. La regla clave: el brazo</h2>
  <p>El brazo es la distancia <b>perpendicular</b> del corte a la <b>línea de acción</b> de la fuerza.</p>
  <p>La fuerza es <b>horizontal</b>, así que su línea de acción es una recta horizontal a la altura de D (la línea punteada).</p>
  <div class="eq">brazo = <b>distancia vertical</b> del corte a esa línea</div>
  <p>Las distancias horizontales (los 4 m de la viga) <b>no importan</b> para esta fuerza.</p>
  <table>
    <tr><th>Punto</th><th>Altura</th><th>Brazo hasta D (altura 8)</th></tr>
    <tr><td>D</td><td>8 m</td><td>0</td></tr>
    <tr><td>C y B</td><td>5 m</td><td>3 m</td></tr>
    <tr><td>A</td><td>0 m</td><td><b>8 m</b></td></tr>
  </table>`},
 {chip:"4. Tramo DC", slider:[0,3,1.5], html:`
  <h2>4. Tramo DC (columna de arriba)</h2>
  <p>Bajas desde D. El brazo es lo que has bajado:</p>
  <div class="eq"><span class="m1">M = 1 · y</span> &nbsp; (y = distancia bajo D)</div>
  <p>Vale 0 en D y <b>3</b> en C. Es un triángulo.</p>`},
 {chip:"5. Tramo CB", slider:[3,7,5], html:`
  <h2>5. Tramo CB (viga)</h2>
  <p>Ahora el corte se mueve <b>horizontalmente</b> por la viga. Todos sus puntos están a la misma altura (5 m), así que la distancia vertical a la línea de acción es siempre 3 m:</p>
  <div class="eq"><span class="m1">M = 1 · 3 = 3</span> &nbsp; <b>constante</b></div>
  <p>Por eso en tu cuaderno la viga tiene un <b>rectángulo</b> de 3. Moverse en horizontal no cambia el brazo de una fuerza horizontal.</p>`},
 {chip:"6. Tramo BA ★", star:true, slider:[7,12,9.5], html:`
  <h2>6. Tramo BA: lo que señalaste</h2>
  <p>Bajas por la columna desde B. Ahora el corte se aleja <b>verticalmente</b> de la línea de acción, así que el brazo crece:</p>
  <div class="eq">brazo = 3 + (lo que bajaste desde B)</div>
  <div class="eq"><span class="m1">M(B) = 1 · 3 = 3</span> &nbsp;&nbsp; <span class="m1">M(A) = 1 · (3 + 5) = 8</span></div>
  <p>Arriba de la columna vale <b>3</b>, que es lo que "llega" desde la viga, y abajo vale <b>8</b>. Como el brazo crece linealmente, el diagrama es un <b>trapecio</b> de 3 a 8.</p>
  <p class="tip">8 = 5 + 3: la altura de la columna AB (5 m) más la de la columna CD (3 m). Es la altura total de D sobre A.</p>`},
 {chip:"7. ¿De qué lado?", html:`
  <h2>7. ¿Por qué se dibuja a la izquierda?</h2>
  <p>Imagina la columna AB empotrada abajo, con todo lo de arriba empujado hacia la derecha por el 1. Se dobla como un poste empujado: hacia la derecha.</p>
  <p>La cara que se <b>estira</b> es la de <b>afuera</b> (la izquierda), así que el diagrama va a la <b>izquierda</b>.</p>
  <p><b>Regla del nudo rígido:</b> en la esquina B la tracción "da la vuelta" sin cambiar de cara. Afuera en la columna AB es arriba en la viga BC, y por eso el rectángulo de la viga está arriba.</p>
  <p class="tip">En C pasa lo mismo: arriba de la viga se conecta con la cara izquierda de CD.</p>`},
 {chip:"8. Rectángulo + triángulo", html:`
  <h2>8. ¿Y la línea punteada con el 5 y el 3?</h2>
  <p>En tu cuaderno el trapecio está partido en dos. Así es más fácil aplicar Vereshchagin, porque las áreas y centroides de rectángulos y triángulos son directos:</p>
  <table>
    <tr><th>Pieza</th><th>Área</th><th>Centroide (desde A)</th></tr>
    <tr><td class="m1">Rectángulo de 3</td><td>3 · 5 = 15</td><td>2.5 m</td></tr>
    <tr><td class="hi">Triángulo de 5 (8 − 3)</td><td>½ · 5 · 5 = 12.5</td><td>5/3 ≈ 1.67 m</td></tr>
  </table>
  <p>Abajo se lee <b>3 + 5 = 8</b>: el ancho del rectángulo más el del triángulo. Arriba solo está el rectángulo (3), porque el triángulo vale 0 en B.</p>
  <p class="tip">Por ejemplo, δ<sub>11</sub> en esta columna = (trapecio) × (trapecio). Con la fórmula de trapecios: ${F('5','6')}(2·3·3 + 2·8·8 + 3·8 + 8·3) = ${F('5','6')}(194) ≈ 161.7.</p>`},
 {chip:"9. Resumen", html:`
  <h2>9. Resumen del diagrama M<sub>1</sub></h2>
  <table>
    <tr><th>Tramo</th><th>Cómo cambia el brazo</th><th>Forma</th></tr>
    <tr><td>DC</td><td>crece de 0 a 3 (bajas)</td><td>triángulo 0 → 3</td></tr>
    <tr><td>CB</td><td>no cambia (vas en horizontal)</td><td>rectángulo 3</td></tr>
    <tr><td><b>BA</b></td><td>crece de 3 a 8 (bajas)</td><td><b>trapecio 3 → 8</b></td></tr>
  </table>
  <p><b>Idea central:</b> con una fuerza <b>horizontal</b>, el momento solo cambia cuando te mueves en <b>vertical</b>. Con una fuerza <b>vertical</b> (estado X<sub>2</sub>) es al revés: solo cambia cuando te mueves en horizontal. Por eso en X<sub>2</sub> la columna AB tiene un rectángulo de 4.</p>`}
];

let cur=0,t=1,anim=null;
const chips=document.getElementById('chips');
steps.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.chip;if(s.star)b.classList.add('star');b.onclick=()=>go(i);chips.appendChild(b);});
const xs=document.getElementById('xs'); xs.oninput=()=>draw();

function el(tag,a,p=svg){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
function text(x,y,s,a={}){const e=el('text',Object.assign({x,y,'font-size':15,fill:css('--ink'),'font-family':'system-ui,sans-serif'},a));e.textContent=s;return e;}
const ease=u=>1-Math.pow(1-u,3);

function fixedBottom(x,y,op=1){ const g=el('g',{opacity:op});
  el('line',{x1:x-26,y1:y,x2:x+26,y2:y,stroke:css('--beam'),'stroke-width':3},g);
  for(let i=-24;i<=18;i+=9) el('line',{x1:x+i,y1:y,x2:x+i-8,y2:y+11,stroke:css('--muted'),'stroke-width':1.4},g); }
function fixedTop(x,y,op=1){ const g=el('g',{opacity:op});
  el('line',{x1:x-22,y1:y,x2:x+22,y2:y,stroke:css('--beam'),'stroke-width':3},g);
  for(let i=-20;i<=14;i+=9) el('line',{x1:x+i,y1:y,x2:x+i+8,y2:y-11,stroke:css('--muted'),'stroke-width':1.4},g); }
function frame(op=1,width=6){
  el('polyline',{points:`${A} ${B} ${C} ${D}`,fill:'none',stroke:css('--beam'),'stroke-width':width,'stroke-linejoin':'round','stroke-linecap':'round',opacity:op});
}
function labels(){
  text(A[0]-28,A[1]+5,'A',{'font-weight':700,'font-size':17});
  text(B[0]-28,B[1]+5,'B',{'font-weight':700,'font-size':17});
  text(C[0]+10,C[1]+20,'C',{'font-weight':700,'font-size':17});
  text(D[0]+12,D[1]+5,'D',{'font-weight':700,'font-size':17});
}
function arrowH(xTip,y,len,color,label){
  el('line',{x1:xTip-len,y1:y,x2:xTip,y2:y,stroke:color,'stroke-width':3});
  el('path',{d:`M${xTip-11},${y-7} L${xTip},${y} L${xTip-11},${y+7}`,fill:'none',stroke:color,'stroke-width':3});
  if(label) text(xTip-len/2-6,y-9,label,{fill:color,'font-weight':700,'font-size':16});
}
function unitX(){ arrowH(D[0]+48,D[1],40,css('--m1'),'1'); }
function actionLine(op=1){
  el('line',{x1:60,y1:D[1],x2:600,y2:D[1],stroke:css('--m1'),'stroke-width':1.5,'stroke-dasharray':'6 5',opacity:op});
  text(70,D[1]-8,'línea de acción del 1 (horizontal)',{fill:css('--m1'),'font-size':12,opacity:op});
}
function heights(){
  const x=560;
  el('line',{x1:x,y1:D[1],x2:x,y2:A[1],stroke:css('--muted'),'stroke-width':1.3});
  [D[1],B[1],A[1]].forEach(y=>el('line',{x1:x-6,y1:y,x2:x+6,y2:y,stroke:css('--muted'),'stroke-width':1.3}));
  text(x+8,(D[1]+B[1])/2+5,'3 m',{fill:css('--muted'),'font-size':13,'font-weight':700});
  text(x+8,(B[1]+A[1])/2+5,'5 m',{fill:css('--muted'),'font-size':13,'font-weight':700});
  el('line',{x1:B[0],y1:A[1]+40,x2:C[0],y2:A[1]+40,stroke:css('--muted'),'stroke-width':1.3});
  [B[0],C[0]].forEach(x=>el('line',{x1:x,y1:A[1]+34,x2:x,y2:A[1]+46,stroke:css('--muted'),'stroke-width':1.3}));
  text((B[0]+C[0])/2-12,A[1]+34,'4 m',{fill:css('--muted'),'font-size':13,'font-weight':700});
}
// diagrama M1 hasta el recorrido p (lado traccionado: izq en DC, arriba en CB, izq en BA)
function diagram(pMax,fill=true){
  const col=css('--m1'), ar=fill?css('--area'):'none';
  if(pMax>0){ const p=Math.min(pMax,3); const y=D[1]+S*p;
    el('polygon',{points:`${D[0]},${D[1]} ${D[0]},${y} ${D[0]-K*p},${y}`,fill:ar,stroke:col,'stroke-width':2.5}); }
  if(pMax>3){ const p=Math.min(pMax,7); const x=C[0]-S*(p-3);
    el('polygon',{points:`${C[0]},${C[1]} ${C[0]},${C[1]-3*K} ${x},${C[1]-3*K} ${x},${C[1]}`,fill:ar,stroke:col,'stroke-width':2.5}); }
  if(pMax>7){ const p=Math.min(pMax,12); const y=B[1]+S*(p-7); const m=3+(p-7);
    el('polygon',{points:`${B[0]},${B[1]} ${B[0]-3*K},${B[1]} ${B[0]-m*K},${y} ${B[0]},${y}`,fill:ar,stroke:col,'stroke-width':2.5}); }
}
function cutAndArm(p){
  const [x,y]=pt(p);
  // pedazo libre resaltado: de D al corte
  let pts=[D];
  if(p>3) pts.push(C);
  if(p>7) pts.push(B);
  pts.push([x,y]);
  el('polyline',{points:pts.map(q=>q.join(',')).join(' '),fill:'none',stroke:css('--hi'),'stroke-width':8,'stroke-linejoin':'round','stroke-linecap':'round',opacity:.55});
  // corte
  const vertical = p<=3 || p>7;
  if(vertical) el('line',{x1:x-16,y1:y,x2:x+16,y2:y,stroke:css('--hi'),'stroke-width':3});
  else el('line',{x1:x,y1:y-16,x2:x,y2:y+16,stroke:css('--hi'),'stroke-width':3});
  el('circle',{cx:x,cy:y,r:5,fill:css('--hi')});
  // brazo: vertical del corte a la línea de acción
  const ax = x + (p>7 ? 34 : (p<=3? -60 : 0));
  const xa = p>3&&p<=7 ? x : ax;
  el('line',{x1:xa,y1:y,x2:xa,y2:D[1],stroke:css('--hi'),'stroke-width':2});
  [y,D[1]].forEach(yy=>el('line',{x1:xa-6,y1:yy,x2:xa+6,y2:yy,stroke:css('--hi'),'stroke-width':2}));
  if(xa!==x) el('line',{x1:x,y1:y,x2:xa,y2:y,stroke:css('--hi'),'stroke-width':1,'stroke-dasharray':'3 3'});
  text(xa+8,(y+D[1])/2+5,'brazo = '+Mval(p).toFixed(1)+' m',{fill:css('--hi'),'font-size':13,'font-weight':700});
}

function draw(){
  svg.innerHTML='';
  const u=ease(t), s=cur, st=steps[s];
  document.getElementById('sliderBox').classList.toggle('show',!!st.slider);
  const ro=document.getElementById('readout');

  if(s===0){
    frame(); fixedBottom(...A); fixedTop(...D); labels(); heights();
    // cargas reales
    arrowH(B[0]-4,B[1]-6,45,css('--load'),'10 kN');
    for(let i=0;i<=8;i++){const x=B[0]+i*20; el('line',{x1:x,y1:B[1]-30,x2:x,y2:B[1]-5,stroke:css('--load'),'stroke-width':1.5});
      el('path',{d:`M${x-4},${B[1]-11} L${x},${B[1]-5} L${x+4},${B[1]-11}`,fill:'none',stroke:css('--load'),'stroke-width':1.5});}
    el('line',{x1:B[0],y1:B[1]-30,x2:C[0],y2:B[1]-30,stroke:css('--load'),'stroke-width':1.5});
    text(B[0]+50,B[1]-38,'5 kN/m',{fill:css('--load'),'font-weight':700,'font-size':14});
    const g=el('g',{opacity:u});
    g.appendChild(text(D[0]+40,D[1]-30,'liberar D →',{fill:css('--m1'),'font-weight':700}));
    g.appendChild(text(D[0]+40,D[1]-10,'X1, X2, X3',{fill:css('--m1'),'font-weight':700}));
  }
  if(s===1){
    frame(); fixedBottom(...A); labels(); heights();
    el('circle',{cx:D[0],cy:D[1],r:5,fill:css('--card'),stroke:css('--beam'),'stroke-width':2});
    if(u>.3) unitX();
    text(300,180,'sin cargas reales',{fill:css('--muted'),'font-size':14,opacity:u});
    text(300,200,'solo el 1 horizontal en D',{fill:css('--m1'),'font-size':14,'font-weight':700,opacity:u});
  }
  if(s===2){
    frame(); fixedBottom(...A); labels(); heights(); unitX(); actionLine(u);
    // flechas de distancia vertical a C/B y a A
    if(u>.6){
      [[C[0]+30,C[1],'3'],[B[0]-40,B[1],'3'],[A[0]-80,A[1],'8']].forEach(([x,y,l])=>{
        el('line',{x1:x,y1:y,x2:x,y2:D[1],stroke:css('--hi'),'stroke-width':2});
        [y,D[1]].forEach(yy=>el('line',{x1:x-5,y1:yy,x2:x+5,y2:yy,stroke:css('--hi'),'stroke-width':2}));
        text(x+6,(y+D[1])/2+5,l+' m',{fill:css('--hi'),'font-weight':700,'font-size':14});
      });
    }
  }
  if(s>=3 && s<=5){
    frame(.35); fixedBottom(A[0],A[1],.35); labels(); unitX(); actionLine(.7);
    const p=+xs.value;
    diagram(p);
    cutAndArm(p);
    const [x,y]=pt(p);
    // valores clave
    if(p>=3) text(C[0]-3*K-18,C[1]+18,'3',{fill:css('--m1'),'font-weight':700});
    if(p>=7){ text(B[0]-3*K-6,B[1]-3*K-6,'3',{fill:css('--m1'),'font-weight':700}); }
    if(p>=11.95) text(A[0]-8*K-6,A[1]+20,'8',{fill:css('--m1'),'font-weight':700,'font-size':17});
    ro.innerHTML=`Tramo <b>${tramo(p)}</b>: brazo = ${Mval(p).toFixed(2)} m → <span class="m1">M<sub>1</sub> = 1 × ${Mval(p).toFixed(2)} = ${Mval(p).toFixed(2)}</span>`;
  }
  if(s===6){
    // deformada exagerada de AB y marcas de tracción
    frame(.25); fixedBottom(...A); labels(); diagram(12);
    const dx=50*u;
    const path=`M${A[0]},${A[1]} C${A[0]},${A[1]-90} ${A[0]+dx*.4},${B[1]+40} ${B[0]+dx},${B[1]}`;
    el('path',{d:path,fill:'none',stroke:css('--beam'),'stroke-width':6,'stroke-linecap':'round'});
    el('polyline',{points:`${B[0]+dx},${B[1]} ${C[0]+dx},${C[1]} ${D[0]+dx},${D[1]}`,fill:'none',stroke:css('--beam'),'stroke-width':6,'stroke-linejoin':'round'});
    arrowH(D[0]+dx+48,D[1],40,css('--m1'),'1');
    if(u>.6){
      [[A[0]-26,A[1]-60],[A[0]-16,A[1]-120],[A[0]-4,A[1]-170]].forEach(([x,y])=>{
        el('path',{d:`M${x},${y-10} L${x},${y-22} M${x-5},${y-17} L${x},${y-22} L${x+5},${y-17} M${x},${y+10} L${x},${y+22} M${x-5},${y+17} L${x},${y+22} L${x+5},${y+17}`,fill:'none',stroke:css('--hi'),'stroke-width':2});
      });
      text(40,A[1]-110,'tracción',{fill:css('--hi'),'font-weight':700});
      text(40,A[1]-92,'(cara izquierda)',{fill:css('--hi'),'font-size':12});
      text(B[0]+dx+20,B[1]-50,'en la viga: arriba',{fill:css('--hi'),'font-size':13,'font-weight':700});
    }
  }
  if(s===7){
    frame(.35); fixedBottom(A[0],A[1],.35); labels();
    diagram(7,true);
    // trapecio partido
    const r=[[B[0],B[1]],[B[0]-3*K,B[1]],[A[0]-3*K,A[1]],[A[0],A[1]]];
    el('polygon',{points:r.map(q=>q.join(',')).join(' '),fill:css('--area'),stroke:css('--m1'),'stroke-width':2.5});
    const tr=[[A[0]-3*K,B[1]],[A[0]-3*K-5*K*u,A[1]],[A[0]-3*K,A[1]]];
    el('polygon',{points:tr.map(q=>q.join(',')).join(' '),fill:css('--area2'),stroke:css('--hi'),'stroke-width':2.5});
    el('line',{x1:B[0]-3*K,y1:B[1],x2:A[0]-3*K,y2:A[1],stroke:css('--ink'),'stroke-width':1.5,'stroke-dasharray':'5 4'});
    if(u>.9){
      text(B[0]-3*K-4,B[1]-8,'3',{fill:css('--m1'),'font-weight':700});
      text(A[0]-3*K/2-5,A[1]+20,'3',{fill:css('--m1'),'font-weight':700});
      text(A[0]-3*K-5*K/2-5,A[1]+20,'5',{fill:css('--hi'),'font-weight':700});
      text(A[0]-8*K-22,A[1]+5,'8',{fill:css('--ink'),'font-weight':700,'font-size':18});
      // centroides
      el('circle',{cx:B[0]-3*K/2,cy:(B[1]+A[1])/2,r:5,fill:css('--m1')});
      el('circle',{cx:A[0]-3*K-5*K/3,cy:A[1]-S*5/3,r:5,fill:css('--hi')});
      text(300,330,'rectángulo: 3 × 5 = 15',{fill:css('--m1'),'font-weight':700,'font-size':16});
      text(300,358,'triángulo: ½ × 5 × 5 = 12.5',{fill:css('--hi'),'font-weight':700,'font-size':16});
      text(300,392,'abajo: 3 + 5 = 8',{'font-weight':700,'font-size':16});
    }
  }
  if(s===8){
    frame(); fixedBottom(...A); labels(); unitX(); diagram(12);
    text(C[0]-3*K-18,C[1]+18,'3',{fill:css('--m1'),'font-weight':700});
    text((B[0]+C[0])/2-4,B[1]-3*K-6,'3',{fill:css('--m1'),'font-weight':700});
    text(B[0]-3*K-6,B[1]-6,'3',{fill:css('--m1'),'font-weight':700});
    text(A[0]-8*K-6,A[1]+20,'8',{fill:css('--m1'),'font-weight':700,'font-size':17});
    text(D[0]-10,D[1]-10,'0',{fill:css('--m1'),'font-weight':700});
    text(330,330,'M1 (m)',{fill:css('--m1'),'font-weight':700,'font-size':18,opacity:u});
    text(330,354,'triángulo → rectángulo → trapecio',{fill:css('--muted'),'font-size':13,opacity:u});
  }
}

function go(i){
  cur=Math.max(0,Math.min(steps.length-1,i));
  const st=steps[cur];
  document.getElementById('text').innerHTML=st.html;
  [...chips.children].forEach((b,k)=>b.classList.toggle('on',k===cur));
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===steps.length-1;
  if(st.slider){ xs.min=st.slider[0]; xs.max=st.slider[1]; xs.value=st.slider[2]; }
  play();
}
function play(){cancelAnimationFrame(anim);const s0=performance.now(),dur=1300;
  const loop=n=>{t=Math.min(1,(n-s0)/dur);draw();if(t<1)anim=requestAnimationFrame(loop);};anim=requestAnimationFrame(loop);}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('replay').onclick=play;
go(0);
</script>
</body>
